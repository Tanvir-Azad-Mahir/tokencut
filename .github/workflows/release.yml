name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            extension: tar.gz
          - name: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            extension: zip
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            extension: tar.gz
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            extension: tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run unit tests
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build release executable
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/tokencut-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" tokencut

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/tokencut.exe" `
            -DestinationPath "dist/tokencut-${{ github.ref_name }}-${{ matrix.name }}.zip"

      - name: Upload packaged executable
        uses: actions/upload-artifact@v4
        with:
          name: tokencut-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all release archives
        uses: actions/download-artifact@v4
        with:
          pattern: tokencut-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
