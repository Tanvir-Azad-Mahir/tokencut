name: Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build optimized CLI
        run: cargo build --release --locked
      - name: Run deterministic benchmark suite
        run: python3 benchmarks/run.py --blocks 200 --runs 7 --warmup 2
      - name: Upload results and sample fixtures
        uses: actions/upload-artifact@v4
        with:
          name: tokencut-benchmarks-${{ github.run_id }}
          path: benchmarks/results/
          retention-days: 30
